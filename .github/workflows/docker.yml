name: docker

# Releases: called from release-please.yml once a release is created (tags pushed by release-please
# with GITHUB_TOKEN don't trigger `on: push: tags`, see docs/RELEASING.md).
# Manual: Actions → docker → Run workflow with an existing release tag, e.g. to rebuild an image.
# PRs touching the image: build only, nothing is pushed.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build (X.Y.Z)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (X.Y.Z)
        type: string
        required: true
      latest:
        description: Also tag the image as `latest`
        type: boolean
        default: true
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .docker/**
      - .github/workflows/docker.yml

env:
  IMAGE: ghcr.io/nicramus/nosqlclient

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check tag
        if: env.PUSH == 'true'
        run: |
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$TAG' is not X.Y.Z"; exit 1; }

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PUSH == 'true' && format('refs/tags/{0}', inputs.tag) || '' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ env.PUSH }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ env.PUSH }}
            type=semver,pattern={{major}},value=${{ inputs.tag }},enable=${{ env.PUSH }}
            type=raw,value=latest,enable=${{ env.PUSH == 'true' && inputs.latest != false }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=nosqlclient
            org.opencontainers.image.description=Web-based MongoDB management tool (fork of nosqlclient)
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Meteor 1.10.2 and the bundled MongoDB 4.2 tools are x86_64 only
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
