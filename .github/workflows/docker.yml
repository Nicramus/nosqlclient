name: docker

# Releases: called from release-please.yml once a release is created (tags pushed by release-please
# with GITHUB_TOKEN don't trigger `on: push: tags`, see docs/RELEASING.md).
# Manual: Actions → docker → Run workflow with an existing release tag, e.g. to rebuild an image.
# PRs touching the image: build only, nothing is pushed.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build (X.Y.Z)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (X.Y.Z)
        type: string
        required: true
      latest:
        description: Also tag the image as `latest`
        type: boolean
        default: true
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .docker/**
      - .github/workflows/docker.yml

env:
  IMAGE: ghcr.io/nicramus/nosqlclient

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check tag
        if: env.PUSH == 'true'
        run: |
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$TAG' is not X.Y.Z"; exit 1; }

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PUSH == 'true' && format('refs/tags/{0}', inputs.tag) || '' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ env.PUSH }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ env.PUSH }}
            type=semver,pattern={{major}},value=${{ inputs.tag }},enable=${{ env.PUSH }}
            type=raw,value=latest,enable=${{ env.PUSH == 'true' && inputs.latest != false }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=nosqlclient
            org.opencontainers.image.description=Web-based MongoDB management tool (fork of nosqlclient)
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # the bundled MongoDB 4.2 tools are x86_64 only
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          # also into the local daemon, for the Trivy scan below
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Start the image against a throwaway MongoDB: the app must come up, write its defaults
      # to its internal DB and serve the client; the bundled mongo tools must run.
      - name: Smoke test
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name smoke-mongo --network smoke mongo:7.0
          for _ in $(seq 30); do
            docker exec smoke-mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1 && break
            sleep 2
          done
          docker run -d --name smoke-app --network smoke -p 3000:3000 \
            -e MONGO_URL=mongodb://smoke-mongo:27017/nosqlclient \
            -e ROOT_URL=http://localhost:3000 \
            "$IMAGE_REF"
          for _ in $(seq 60); do
            curl -fsS http://localhost:3000/healthcheck && break
            [ "$(docker inspect -f '{{.State.Running}}' smoke-app)" = true ] || { echo "::error::app container exited"; exit 1; }
            sleep 2
          done
          echo
          curl -fsS http://localhost:3000/healthcheck
          echo
          curl -fsS http://localhost:3000/ | grep -q __meteor_runtime_config__
          docker exec smoke-mongo mongosh --quiet nosqlclient \
            --eval 'quit(db.settings.countDocuments() === 1 ? 0 : 1)'
          docker exec smoke-app mongo --version
          docker exec smoke-app mongodump --version

      - name: Smoke test logs
        if: failure()
        run: docker logs smoke-app || true

      # Report-only for now: the Node 14 / bullseye base has many known CVEs.
      # Trivy runs from its image pinned by digest, not via aquasecurity/trivy-action
      # (tags of that action were hijacked in March 2026, CVE-2026-33634).
      - name: Trivy image scan
        env:
          TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          SCAN_REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/out" \
            "$TRIVY_IMAGE" image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format sarif --output /out/trivy.sarif \
            "$SCAN_REF"

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy-image
