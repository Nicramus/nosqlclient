name: lint-config

# Linters for the non-JS parts: workflows, Dockerfile, shell scripts.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: actionlint
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: hadolint
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD:/repo" -w /repo hadolint/hadolint:v2.12.0 hadolint --config .hadolint.yaml Dockerfile

      - name: shellcheck
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD:/repo" -w /repo koalaman/shellcheck:v0.10.0 .docker/entrypoint.sh scripts/*.sh
